name: docmost_ios
description: Docmost iOS & iPadOS Client in Flutter (Clean Mantine Dark Edition)
publish_to: "none"
version: 0.1.7+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.16.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: false
  ios: true
  remove_alpha_ios: true
