name: Build Docmost iOS (Flutter)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Analyze, Test & Build iOS (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS Project & Apply Overrides
        working-directory: mobile
        run: |
          flutter create --org de.klehausen --project-name docmost_ios --platforms=ios .
          git checkout -- pubspec.yaml lib/ test/ README.md .gitignore analysis_options.yaml
          cp ios_overrides/Info.plist ios/Runner/Info.plist
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile
            sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile
          fi
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' ios/Runner.xcodeproj/project.pbxproj
          fi
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze & Run Tests
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Build iOS App (No Codesign)
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        working-directory: mobile
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -r -y Docmost-iOS-unsigned.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Docmost-iOS-unsigned-ipa
          path: mobile/build/ipa/Docmost-iOS-unsigned.ipa

      - name: Attach IPA to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            mobile/build/ipa/Docmost-iOS-unsigned.ipa
