name: Release & Package Docmost Desktop

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Release Binary
        run: cargo build --release

      - name: Build NSIS Setup Installer
        run: |
          mkdir dist -Force
          makensis installer.nsi

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: "Docmost Desktop ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}"
          files: |
            dist/Docmost-Setup.exe
            target/release/docmost-app.exe
          draft: false
          prerelease: false
          generate_release_notes: true
